services:
  app:
    build: .
    container_name: agent-m-app
    working_dir: /code/app
    env_file:
      - .env
    environment:
      - CONFIG_FILE=/code/app/config.yaml
    volumes:
      - ./app:/code/app
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
