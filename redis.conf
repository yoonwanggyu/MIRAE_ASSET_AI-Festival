# 클러스터 모드 활성화
cluster-enabled yes
# 클러스터 설정 파일 경로
cluster-config-file /data/nodes.conf
# 클러스터 노드 타임아웃
cluster-node-timeout 5000
# 외부 접속을 위해 자신의 IP를 알리는 설정 (Docker 네트워크 이름 사용)
cluster-announce-ip redis
# 포트 설정
port 6379
# 백그라운드 실행 비활성화 (Docker가 관리)
daemonize no
# appendonly 모드 활성화 (데이터 영속성)
appendonly yes